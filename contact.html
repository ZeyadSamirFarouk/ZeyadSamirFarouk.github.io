<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>اطلب الآن | زياد سمير</title>
    <meta
      name="description"
      content="تواصل مع زياد سمير لطلب خدمات الجرافيك ديزاين مباشرة عبر واتساب أو من خلال نموذج الطلب."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="container nav">
        <a class="brand" href="index.html">زياد سمير | Graphic Design</a>
        <nav class="nav-links" aria-label="التنقل الرئيسي">
          <a href="index.html">الرئيسية</a>
          <a href="portfolio.html">الأعمال</a>
          <a href="services.html">الخدمات</a>
          <a class="active" href="contact.html">اطلب الآن</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <section>
        <h1>تواصل واطلب تصميمك</h1>
        <p class="section-intro">
          تقدر تتواصل مباشرة عبر واتساب أو ترسل طلبك من النموذج وسيتم فتح رسالة
          جاهزة تلقائيًا.
        </p>
      </section>

      <section class="grid two">
        <article class="card">
          <h2>بيانات التواصل</h2>
          <div class="contact-list">
            <div class="contact-item">
              <span>واتساب</span>
              <a class="btn primary" href="https://wa.me/201029100044" target="_blank" rel="noopener">01029100044</a>
            </div>
            <div class="contact-item">
              <span>رسالة مباشرة</span>
              <a class="btn secondary" href="https://wa.me/201029100044?text=%D9%85%D8%B1%D8%AD%D8%A8%D8%A7%D9%8B%D8%8C%20%D8%B9%D8%A7%D9%88%D8%B2%20%D8%A7%D8%B3%D8%AA%D9%81%D8%B3%D8%B1%20%D8%B9%D9%86%20%D8%AE%D8%AF%D9%85%D8%A9%20%D8%AA%D8%B5%D9%85%D9%8A%D9%85" target="_blank" rel="noopener">ابدأ المحادثة</a>
            </div>
          </div>
        </article>

        <article class="card">
          <h2>نموذج طلب سريع</h2>
          <form id="request-form">
            <div>
              <label for="name">الاسم</label>
              <input id="name" name="name" type="text" placeholder="اكتب اسمك" required />
            </div>
            <div>
              <label for="service">نوع الخدمة</label>
              <select id="service" name="service" required>
                <option value="">اختر الخدمة</option>
                <option>تصميم سوشيال ميديا</option>
                <option>هوية بصرية</option>
                <option>إعلان مطبوع/ديجيتال</option>
                <option>خدمة أخرى</option>
              </select>
            </div>
            <div>
              <label for="details">تفاصيل الطلب</label>
              <textarea id="details" name="details" placeholder="اكتب المطلوب بالتفصيل" required></textarea>
            </div>
            <button type="submit" class="btn primary">إرسال على واتساب</button>
          </form>
        </article>
      </section>
    </main>

    <footer>
      <div class="container">
        © <span id="year"></span> زياد سمير - جميع الحقوق محفوظة.
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
